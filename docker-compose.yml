# Local system of record for the poller. Logical replication is on so CDC
# (Debezium Server or Estuary) can read the WAL in week 2.
services:
  postgres:
    image: postgres:17
    container_name: ghost-ledger-postgres
    environment:
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
      POSTGRES_DB: ghost_ledger
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      # DDIA ch. 6 "log retention dilemma": cap WAL kept for a lagging CDC slot
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created; `make db-reset` to re-run
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
