name: nightly

# The batch layer (DDIA ch. 11): load a new GTFS feed if CTA published one, rebuild the
# Intermediate and analytics models from Ingress for a window of service dates, test them,
# and publish the analytics tables to the lake. Everything is derived and idempotent: a rerun
# of the same window rewrites the same partitions. Run it by hand with a date range to
# rebuild history after a logic change (replay from the log).

# When it runs: AWS EventBridge starts it at 06:23 CDT / 05:23 CST through the dispatch API
# (infra/terraform/prod/nightly_trigger.tf), because GitHub's own schedule is best effort
# (Sep 27: 4.5 h late; Sep 28: never started). GitHub's schedule stays as two backups.
# Automatic starts skip themselves once yesterday is published (the `check` job); runs
# started by hand always run. Runs queue, never overlap. The report-stale alarm (box
# monitor) emails if yesterday still isn't on the site by 10:00 CT.
on:
  schedule:
    - cron: "7 12 * * *"  # backup, 07:07 CDT
    - cron: "53 13 * * *"  # backup, 08:53 CDT
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started it: aws (EventBridge) skips when yesterday is published"
        default: "manual"
      start_date:
        description: "First service date to rebuild (YYYY-MM-DD). Empty = the last 3 days."
        default: ""
      end_date:
        description: "Last service date to rebuild (YYYY-MM-DD)."
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC: assume the transform role, no stored AWS keys

env:
  AWS_REGION: us-east-2
  LAKE: s3://ghost-ledger-lake-354894954112
  GTFS_ROOT: s3://ghost-ledger-lake-354894954112/gtfs
  SITE: s3://ghost-ledger-site-354894954112

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - id: done
        name: Already published yesterday? (automatic starts only)
        env:
          AUTO: ${{ github.event_name == 'schedule' || inputs.trigger == 'aws' }}
        run: |
          yesterday=$(TZ=America/Chicago date -d yesterday +%F)
          if [ "$AUTO" = true ] && curl -fsS https://www.chitransit.fyi/data/v1/report.json \
              | jq -e --arg d "$yesterday" '.days | index($d) != null' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$yesterday is already published: nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          enable-cache: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TRANSFORM_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install
        run: uv sync --frozen --group transform

      - name: Load GTFS (skipped when the feed is unchanged)
        run: uv run --group transform python transform/load_gtfs.py --root "$GTFS_ROOT"

      - name: Ingress freshness
        working-directory: transform
        run: uv run --group transform dbt source freshness --profiles-dir .

      - name: Build and test (dbt build)
        working-directory: transform
        env:
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
        run: |
          # Manual inputs reach dbt's --vars: accept only plain dates.
          for d in "$START" "$END"; do
            if [ -n "$d" ] && ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::dates must be YYYY-MM-DD, got '$d'"; exit 1
            fi
          done
          vars="{}"
          if [ -n "$START" ]; then vars="{start_date: '$START', end_date: '${END:-$START}'}"; fi
          uv run --group transform dbt build --profiles-dir . --vars "$vars"

      - name: Publish analytics to the lake
        run: uv run --group transform python transform/publish.py --db transform/target/ghost_ledger.duckdb --to "$LAKE/analytics"

      - name: Ingress day counts (evidence for the box's prune gate)
        run: uv run --group transform python transform/ingress_counts.py --to "$LAKE/analytics/ops/ingress_day_counts.json"

      # The internal ops view: private, never on the public site. Download it from this run's
      # artifacts ("dashboard"), or build it locally with `make dashboard`.
      - name: Dashboard
        run: uv run --group transform python transform/dashboard.py --src "$LAKE/analytics" --out ops-site/index.html

      - name: Scheduled gaps and departures for today and tomorrow (the "right now" rules)
        working-directory: transform
        run: |
          # Schedule only (GTFS, no Ingress). Rebuilds int_scheduled_trips for these two days in
          # the local DuckDB file after the analytics are published, so nothing public changes.
          today=$(TZ=America/Chicago date +%F)
          tomorrow=$(TZ=America/Chicago date -d tomorrow +%F)
          uv run --group transform dbt run -s +site_headways +live_stop_departures --profiles-dir . \
            --vars "{start_date: '$today', end_date: '$tomorrow'}"

      - name: Live schedule for the poller (every scheduled departure per stop, today and tomorrow)
        # Private (analytics/ops/, only the box reads it); checked before writing. The poller
        # reloads it hourly and keeps its last good copy if this step fails.
        run: |
          uv run --group transform python transform/live_schedule.py \
            --db transform/target/ghost_ledger.duckdb --to "$LAKE/analytics/ops/stop_departures.json"

      - name: Site data (route shapes, names, scheduled gaps, yesterday's summary)
        run: |
          # Checks the files against the site's contract first; on failure nothing is uploaded.
          uv run --group transform python transform/site_data.py --db transform/target/ghost_ledger.duckdb --out site-data \
            --history "$LAKE/analytics"
          aws s3 sync site-data "$SITE/data" --cache-control "public, max-age=3600" --only-show-errors
          # The daily files are small and change each morning: 5 minutes at the edge, not an hour.
          for f in report summary headways routes; do
            aws s3 cp "site-data/v1/$f.json" "$SITE/data/v1/$f.json" \
              --cache-control "public, max-age=300" --content-type application/json --only-show-errors
          done

      # Last, under its own role (the transform role can't write Ingress): lock the day's data
      # files for 10 years, tag each finished day's snapshot, trim untagged history (metadata
      # only; that role can't delete anything). transform/lake_maintenance.py.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_LAKE_MAINTENANCE_ROLE_ARN }}
          aws-region: us-east-2

      - name: Ingress upkeep (lock, tag, trim)
        run: uv run --group transform python transform/lake_maintenance.py --apply

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: ops-site/index.html
          retention-days: 30
