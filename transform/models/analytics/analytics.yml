version: 2

models:
  - name: trip_status
    description: >
      One row per scheduled bus trip and service date (GTFS feed in force that day), with
      what happened to it. Grain: (service_date, trip_id).
    columns:
      - name: status
        description: >
          ran | likely_ran (single report, or the block's bus was on this pattern under another
          key or reappeared at the trip's far end) | flagged (CTA announced it canceled, dyn=1,
          at a stop it serves) | silent (not seen, not announced, one of its stops sampled
          before it was due) | missing (same, stops not sampled) | unknown (not watched, or a
          detour on the route) | pending (not over yet). See the model header for the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ran, likely_ran, flagged, silent, missing, unknown, pending]
      - name: reason
        description: "Why: not_watched, detour, single_report, miskeyed, tracker_gap, flags_not_sampled."
        data_tests:
          - accepted_values:
              arguments:
                values: [not_watched, detour, single_report, miskeyed, tracker_gap, flags_not_sampled]
      - name: ghost_evidence
        description: >
          For silent/missing trips, what the block's bus was doing (int_missing_trip_evidence):
          bus_elsewhere and reappeared_same_end are physical evidence it did not run the trip.
        data_tests:
          - accepted_values:
              arguments:
                values: [bus_elsewhere, reappeared_same_end, reappeared_elsewhere, bus_not_seen_again, no_block_bus]
      - name: strict_evidence
        description: Silent/missing with physical evidence the block's bus did not run it. The conservative ghost count.
      - name: gap_ratio
        description: >
          Wait at the trip's middle stop between the buses before and after it over the scheduled
          headway: the impact riders felt. Not evidence the trip didn't run (a bus with a dead
          tracker leaves the same hole in our data).
      - name: flags_sampled
        description: One of the trip's own stops was sampled for predictions in the 30 minutes before it was due there.

  - name: route_hour_delivery
    description: >
      trip_status counted per service date, route, direction and scheduled start hour
      (Chicago), without pending trips. Grain: (service_date, rt, direction, start_hour).

  - name: stop_hour_service
    description: >
      Headways, gaps (> 2x scheduled headway) and bunching (< 25%) per stop, route,
      direction and clock hour, terminals excluded, gated on sweep coverage >= 90%.
      Grain: (service_date, rt, direction, stop_id, hour_start).
    columns:
      - name: bunched
        description: Headways under 25% of the scheduled headway; NULL when the hour wasn't watched enough.
      - name: gaps
        description: Headways over 2x the scheduled headway; NULL when the hour wasn't watched enough.
  - name: site_patterns
    description: >
      Each pattern's shape (coords, [lon, lat] in sequence) and stops (with feet along it) as
      of the run, published one JSON per pid for the site's live map.
    columns:
      - name: pid
        data_tests: [unique, not_null]
      - name: coords
        data_tests: [not_null]
  - name: site_routes
    description: Route names (newest GTFS feed) for the site.
    columns:
      - name: rt
        data_tests: [unique, not_null]
  - name: site_headways
    description: Scheduled gap between buses per route, direction and Chicago hour (60 min / trips starting that hour).
  - name: live_stop_departures
    description: >
      Scheduled departures at every stop (all trips of the route; a trip's last stop left
      out) and 'L' platform, today and tomorrow, for the poller's live schedule
      (analytics/ops/stop_departures.json).
    columns:
      - name: departs_at
        data_tests: [not_null]
  - name: site_route_summary
    description: Per route and finished service day, trips by outcome; silent as proven to possible.
