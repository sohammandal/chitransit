# Local system of record for the poller. Logical replication is on so CDC
# (Debezium Server) can read the WAL. The same setup runs 24/7 on a Lightsail box.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
      POSTGRES_DB: ghost_ledger
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      # Cap the WAL kept for a lagging CDC slot
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Schema migrations (db/migrations). On demand only: `make migrate`.
  # Runs the same way on the laptop and on the Lightsail box, nothing to install.
  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://ghost:ghost@postgres:5432/ghost_ledger?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./db:/db
    depends_on:
      postgres:
        condition: service_healthy

  # CDC in dev: `docker compose --profile cdc up -d debezium`.
  # Reads the dev Postgres change log and writes Iceberg tables to ./data/lake.
  debezium:
    image: ghcr.io/memiiso/debezium-server-iceberg:1.0.0.Final
    profiles: ["cdc"]
    volumes:
      - ./cdc/debezium/application.dev.properties:/debezium/config/application.properties:ro
      - ./data/lake:/data/warehouse
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
