          - {service_date: "2026-09-26", trip_id: "L2", feed_id: "f", rt: "9", direction: "North", block_id: "bL2", pid: 10, start_s: 39600, end_s: 40800, scheduled_start: "2026-09-26 11:00:00-05", scheduled_end: "2026-09-26 11:02:00-05"}
          - {service_date: "2026-09-26", trip_id: "L3", feed_id: "f", rt: "9", direction: "North", block_id: "bL3", pid: 10, start_s: 41400, end_s: 42600, scheduled_start: "2026-09-26 11:30:00-05", scheduled_end: "2026-09-26 11:32:00-05"}
          - {service_date: "2026-09-26", trip_id: "S1", feed_id: "f", rt: "9", direction: "North", block_id: "bS1", pid: 10, start_s: 43200, end_s: 44400, scheduled_start: "2026-09-26 12:00:00-05", scheduled_end: "2026-09-26 12:02:00-05"}
