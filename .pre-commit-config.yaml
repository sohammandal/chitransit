repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # syntax only: compose.prod.yml uses Compose's !override tag
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]  # Lint + auto-fix (rules incl. import sorting in pyproject.toml)
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      # Postgres SQL (infra/db/migrations). dbt models are DuckDB + Jinja: CI validates them with
      # dbt parse and unit tests instead.
      - id: sqlfluff-fix
        args: [--show-lint-violations]
        exclude: ^transform/
      - id: sqlfluff-lint
        exclude: ^transform/
