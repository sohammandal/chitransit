          - {service_date: "2026-09-26", trip_id: "M1", feed_id: "f", rt: "9", direction: "North", block_id: "bM1", pid: 10, start_s: 46800, end_s: 48000, scheduled_start: "2026-09-26 13:00:00-05", scheduled_end: "2026-09-26 13:02:00-05"}
      - input: ref('int_trip_matches')
