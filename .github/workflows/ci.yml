name: ci

# Every PR and every push to main: lint, then the full test suite against a real Postgres
# (logical replication on, migrations applied). On main only, build the prod image and push
# it to GHCR; the box pulls :main within 5 minutes (infra/box/deploy.sh).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Start Postgres and apply migrations
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm dbmate up

      - name: Test
        run: uv run pytest -v

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

  terraform:
    # Offline checks (no AWS): formatting and validity of both stacks on every change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
      - run: terraform fmt -check -recursive -diff infra/terraform
      - name: Validate
        run: |
          for stack in bootstrap prod; do
            terraform -chdir=infra/terraform/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/$stack validate
          done

  # dbt: build every model with zero rows against the real sources (read-only role), then run
  # the data tests and the business-rule unit tests. Catches SQL, ref and logic regressions
  # before the nightly job runs the change on real data.
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GTFS_ROOT: s3://ghost-ledger-lake-354894954112/gtfs
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          enable-cache: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install
        run: uv sync --frozen --group transform

      - name: dbt build --empty (schema, data tests, unit tests)
        working-directory: transform
        run: uv run --group transform dbt build --profiles-dir . --empty

  image:
    needs: [test, terraform, transform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghost-ledger:main
            ghcr.io/${{ github.repository_owner }}/ghost-ledger:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
