version: 2

models:
  - name: int_scheduled_trips
    description: Bus trips scheduled per service date by the GTFS feed in force. Grain (service_date, trip_id).
    columns:
      - name: feed_id
        data_tests: [not_null]
      - name: scheduled_start
        data_tests: [not_null]
  - name: int_observed_trips
    description: Trips the feed showed, keyed (service_date, rt, pid, start_s) after the midnight shift.
  - name: int_trip_flags
    description: Trips flagged canceled (dyn=1) in sampled predictions, per stop; cleared_at = a later sample at that stop showed it not canceled. Grain (service_date, rt, direction, start_s, stop_id).
  - name: int_feed_minutes
    description: Per minute, whether a clean sweep ran and whether predictions were sampled.
    columns:
      - name: minute
        data_tests: [unique, not_null]
  - name: int_stop_passes
    description: >
      Stop passes, with the live feed's rules (ghost_ledger.live.trip_passes). Grain
      (service_date, rt, pid, start_s, vid, seq).
    columns:
      - name: passed_at
        data_tests: [not_null]
      - name: bounded
        description: >
          Passed during a tracker blackout: passed_at is the latest it can have been (the
          next report), not an interpolation. Headways next to it aren't timed.
        data_tests: [not_null]
  - name: int_scheduled_departures
    description: Scheduled departures per stop. Grain (service_date, trip_id, stop_sequence).
  - name: int_detour_windows
    description: Times a route ran patterns its GTFS schedule lacks (detours), widened an hour each side.
  - name: int_trip_matches
    description: Observed trip explaining each scheduled trip (pid+start, else route+start). Grain (service_date, trip_id), matched only.
  - name: int_missing_trip_evidence
    description: >
      For unmatched trips, where the block's bus was during and after the trip (seen
      elsewhere, on this pattern, reappeared at the far or same end). Grain (service_date, trip_id).
  - name: int_trip_service_gaps
    description: >
      Wait at each trip's middle scheduled stop between the buses just before and after its
      scheduled time, as a multiple of the scheduled headway. ~2x corroborates a missing trip.
