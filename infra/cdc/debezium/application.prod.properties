# Debezium Server + Iceberg consumer (memiiso/debezium-server-iceberg 1.0.0.Final), PROD.
# Postgres on the box (system of record) -> logical decoding (pgoutput) -> Iceberg tables on
# S3 (Ingress), tracked in the Glue catalog. No Kafka. Same event shape as dev
# (application.dev.properties); only the catalog, storage, slot and batching differ.
# ${VAR} values come from /etc/ghost-ledger/prod.env (compose env_file); no secrets here.

# ---------- source: Postgres on the box ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=ghost
debezium.source.database.password=${POSTGRES_PASSWORD}
debezium.source.database.dbname=ghost_ledger
debezium.source.topic.prefix=ghost
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=ghost_ledger_cdc
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=ghost_ledger_prod
debezium.source.table.include.list=ops.sweeps,ops.raw_polls,ops.raw_responses,ops.bus_positions,ops.bus_assignments,ops.patterns
debezium.source.snapshot.mode=initial
debezium.source.offset.flush.interval.ms=0

# ---------- sink: Iceberg on S3, Glue catalog (Terraform: infra/terraform/prod/lake.tf) ----------
debezium.sink.type=iceberg
debezium.sink.iceberg.catalog-name=glue
debezium.sink.iceberg.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
debezium.sink.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
debezium.sink.iceberg.warehouse=s3://${LAKE_BUCKET}/warehouse
debezium.sink.iceberg.client.region=${AWS_REGION}
debezium.sink.iceberg.table-namespace=${GLUE_DATABASE}
# Append mode: every change event is kept (Ingress is the full log, never updated in place)
debezium.sink.iceberg.upsert=false
debezium.sink.iceberg.write.format.default=parquet

# ---------- batching: fewer, bigger files ----------
# Commit when 10k events are queued or 5 minutes have passed, whichever is first: ~288
# commits per table per day instead of one per 30 s sweep. Slot lag stays a few MB.
debezium.sink.batch.batch-size-wait=MaxBatchSizeWait
debezium.sink.batch.batch-size-wait.max-wait-ms=300000
debezium.sink.batch.batch-size-wait.wait-interval-ms=10000
debezium.source.max.batch.size=10000
debezium.source.max.queue.size=20000

# ---------- event format (mandatory for the Iceberg consumer) ----------
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=true
debezium.format.key.schemas.enable=true

# ---------- Debezium's bookmark lives in Iceberg, next to the data ----------
debezium.source.offset.storage=io.debezium.server.iceberg.offset.IcebergOffsetBackingStore
debezium.source.offset.storage.iceberg.table-name=debezium_offset_storage
debezium.source.schema.history.internal=io.debezium.server.iceberg.history.IcebergSchemaHistory
debezium.source.schema.history.internal.iceberg.table-name=debezium_schema_history

# ---------- flatten each event to its row, plus where it sits in the change log ----------
# __source_sequence = [previous commit LSN, change LSN]: constant within a transaction and rising
# in commit order (pgoutput streams whole transactions in commit order), so it orders concurrent
# writers, whose change LSNs interleave in the WAL.
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,table,lsn,txId,source.sequence,source.ts_ns,db,ts_ms
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite

quarkus.log.level=INFO
