# Prod layer over compose.yml. deploy.sh runs, from /opt/ghost-ledger on the box:
#   docker compose -p ghost-ledger -f compose.yml -f compose.prod.yml \
#     --env-file /etc/ghost-ledger/prod.env up -d --remove-orphans
# Every variable below comes from that env file (written by `make prod-secrets`), never
# from the repo. ENV_FILE and IMAGE can be overridden for the local rehearsal.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ${IMAGE:-ghcr.io/sohammandal/ghost-ledger:main}
  env_file: ["${ENV_FILE:-/etc/ghost-ledger/prod.env}"]
  restart: always
  logging: *logging

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the prod env file}
    # Tuned for a 2 GB box shared with the poller, monitor and (week 2) Debezium
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=2000
    # Only reachable from the box itself (the laptop uses an SSH tunnel)
    ports: !override
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    restart: always
    logging: *logging

  # One-shot: apply db/migrations (baked into the image) before the poller starts
  migrate:
    <<: *app
    entrypoint: ["dbmate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  poller:
    <<: *app
    command: ["poll"]
    # SIGTERM lets the current sweep finish and commit
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  monitor:
    <<: *app
    command: ["monitor"]
    depends_on:
      postgres:
        condition: service_healthy

  # CDC (profile cdc, which deploy.sh turns on): Postgres change log -> Iceberg on S3
  # (Ingress). Reads POSTGRES_PASSWORD and the box's AWS key from the env file; its bookmark
  # (offsets) lives in Iceberg, so no volume.
  debezium:
    env_file: ["${ENV_FILE:-/etc/ghost-ledger/prod.env}"]
    environment:
      LAKE_BUCKET: ghost-ledger-lake-354894954112
      GLUE_DATABASE: ghost_ledger_ingress
      # 2 GB box shared with Postgres: cap the heap at 512 MB. Measured 2026-09-26: the heap
      # fills to its cap and ~260 MB sits outside it (classes, code cache, threads), so the
      # limit leaves room above ~800 MB. Fewer malloc arenas keep native memory from creeping.
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    mem_limit: 1100m
    volumes: !override
      - ./cdc/application.prod.properties:/debezium/config/application.properties:ro
    stop_grace_period: 60s
    restart: always
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
