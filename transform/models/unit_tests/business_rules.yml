# Unit tests: fixed inputs -> exact outputs for the rules the numbers depend on.
unit_tests:
  - name: observed_trips_shift_trips_after_midnight_to_the_next_service_date
    description: >
      Buses report a trip after midnight as stst >= 86,400 on the previous stsd; CTA's GTFS
      lists it on the next date. Reports missing pid/stsd/stst can't be keyed and are dropped.
    model: int_observed_trips
    overrides:
      vars: {start_date: "2026-09-26", end_date: "2026-09-26"}
    given:
      - input: ref('stg_bus_positions')
        rows:
          # 00:30 on Sep 26, trip that began at 24:10 on service day Sep 25
          - {vid: "1", observed_at: "2026-09-26 00:30:00-05", rt: "9", pid: 10, pdist: 500, stsd: "2026-09-25", stst: 87000}
          - {vid: "1", observed_at: "2026-09-26 00:31:00-05", rt: "9", pid: 10, pdist: 900, stsd: "2026-09-25", stst: 87000}
          # an ordinary daytime trip
          - {vid: "2", observed_at: "2026-09-26 08:00:00-05", rt: "9", pid: 10, pdist: 100, stsd: "2026-09-26", stst: 28800}
          # no pid: can't be matched to a pattern
          - {vid: "3", observed_at: "2026-09-26 08:00:00-05", rt: "9", pid: null, pdist: 100, stsd: "2026-09-26", stst: 28800}
          # the previous service day's ordinary trip: outside the window
          - {vid: "4", observed_at: "2026-09-25 22:00:00-05", rt: "9", pid: 10, pdist: 100, stsd: "2026-09-25", stst: 79200}
    expect:
      rows:
        - {service_date: "2026-09-26", rt: "9", pid: 10, start_s: 600, n_reports: 2, n_buses: 1, min_pdist: 500, max_pdist: 900}
        - {service_date: "2026-09-26", rt: "9", pid: 10, start_s: 28800, n_reports: 1, n_buses: 1, min_pdist: 100, max_pdist: 100}

  - name: stop_passes_interpolate_forward_progress_only
    description: >
      A stop between two reports is passed in proportion to the distance covered. A report
      behind the furthest point reached (pdist jumped back) starts no step, and pairs more
      than 5 minutes apart are not interpolated.
    model: int_stop_passes
    overrides:
      vars: {start_date: "2026-09-26", end_date: "2026-09-26"}
    given:
      - input: ref('stg_bus_positions')
        rows:
          - {vid: "1", observed_at: "2026-09-26 10:00:00-05", rt: "9", pid: 10, pdist: 0, stsd: "2026-09-26", stst: 36000}
          - {vid: "1", observed_at: "2026-09-26 10:00:40-05", rt: "9", pid: 10, pdist: 1000, stsd: "2026-09-26", stst: 36000}
          # jumps back to 0: no step starts here
          - {vid: "1", observed_at: "2026-09-26 10:01:10-05", rt: "9", pid: 10, pdist: 0, stsd: "2026-09-26", stst: 36000}
          - {vid: "1", observed_at: "2026-09-26 10:01:40-05", rt: "9", pid: 10, pdist: 1200, stsd: "2026-09-26", stst: 36000}
          # 10 minutes later: too long a gap to interpolate stop 5
          - {vid: "1", observed_at: "2026-09-26 10:11:40-05", rt: "9", pid: 10, pdist: 3000, stsd: "2026-09-26", stst: 36000}
      - input: ref('stg_pattern_stops')
        rows:
          - {pid: 10, valid_from: "-infinity", valid_to: null, seq: 1, stop_id: "A", pdist: 0}
          - {pid: 10, valid_from: "-infinity", valid_to: null, seq: 2, stop_id: "B", pdist: 500}
          - {pid: 10, valid_from: "-infinity", valid_to: null, seq: 3, stop_id: "C", pdist: 1000}
          - {pid: 10, valid_from: "-infinity", valid_to: null, seq: 4, stop_id: "D", pdist: 1100}
          - {pid: 10, valid_from: "-infinity", valid_to: null, seq: 5, stop_id: "E", pdist: 2000}
    expect:
      rows:
        - {seq: 1, stop_id: "A", passed_at: "2026-09-26 10:00:00-05"}
        - {seq: 2, stop_id: "B", passed_at: "2026-09-26 10:00:20-05"}
        - {seq: 3, stop_id: "C", passed_at: "2026-09-26 10:00:40-05"}

  - name: stop_passes_use_the_pattern_version_in_force
    description: >
      A pid's stop list can change (SCD2). A step is interpolated against the version valid
      when it starts: stop A sits at 500 ft before 10:05 and at 800 ft after.
    model: int_stop_passes
    overrides:
      vars: {start_date: "2026-09-26", end_date: "2026-09-26"}
    given:
      - input: ref('stg_bus_positions')
        rows:
          - {vid: "1", observed_at: "2026-09-26 10:00:00-05", rt: "9", pid: 10, pdist: 0, stsd: "2026-09-26", stst: 36000}
          - {vid: "1", observed_at: "2026-09-26 10:00:40-05", rt: "9", pid: 10, pdist: 1000, stsd: "2026-09-26", stst: 36000}
          - {vid: "2", observed_at: "2026-09-26 10:10:00-05", rt: "9", pid: 10, pdist: 0, stsd: "2026-09-26", stst: 36600}
          - {vid: "2", observed_at: "2026-09-26 10:10:40-05", rt: "9", pid: 10, pdist: 1000, stsd: "2026-09-26", stst: 36600}
      - input: ref('stg_pattern_stops')
        rows:
          - {pid: 10, valid_from: "-infinity", valid_to: "2026-09-26 10:05:00-05", seq: 1, stop_id: "A", pdist: 500}
          - {pid: 10, valid_from: "2026-09-26 10:05:00-05", valid_to: null, seq: 1, stop_id: "A", pdist: 800}
    expect:
      rows:
        - {vid: "1", stop_id: "A", passed_at: "2026-09-26 10:00:20-05"}
        - {vid: "2", stop_id: "A", passed_at: "2026-09-26 10:10:32-05"}

  - name: trip_matches_pattern_then_route
    description: >
      Same pid and a GTFS start 0-120 s after the bus's stst matches; among leftovers, same
      route and start matches a bus on a detour pid; 200 s off matches nothing; of two trips
      at the same minute on different patterns, only the one whose pattern ran matches.
    model: int_trip_matches
    given:
      - input: ref('int_scheduled_trips')
        rows:
          - {service_date: "2026-09-26", trip_id: "T1", feed_id: "f", rt: "9", direction: "North", block_id: "b1", pid: 10, start_s: 36000, end_s: 37200, scheduled_start: "2026-09-26 10:00:00-05", scheduled_end: "2026-09-26 10:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "T2", feed_id: "f", rt: "9", direction: "North", block_id: "b2", pid: 10, start_s: 37800, end_s: 39000, scheduled_start: "2026-09-26 10:30:00-05", scheduled_end: "2026-09-26 10:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "T6", feed_id: "f", rt: "9", direction: "North", block_id: "b6", pid: 10, start_s: 45000, end_s: 46200, scheduled_start: "2026-09-26 12:30:00-05", scheduled_end: "2026-09-26 12:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "T12", feed_id: "f", rt: "9", direction: "North", block_id: "b12", pid: 10, start_s: 50000, end_s: 51200, scheduled_start: "2026-09-26 13:53:00-05", scheduled_end: "2026-09-26 14:13:00-05"}
          - {service_date: "2026-09-26", trip_id: "T13", feed_id: "f", rt: "9", direction: "North", block_id: "b13", pid: 11, start_s: 50000, end_s: 51200, scheduled_start: "2026-09-26 13:53:00-05", scheduled_end: "2026-09-26 14:13:00-05"}
      - input: ref('int_observed_trips')
        rows:
          - {service_date: "2026-09-26", rt: "9", pid: 10, start_s: 35950, first_seen_at: "2026-09-26 10:00:00-05", n_reports: 5, first_vid: "A", last_vid: "A"}
          - {service_date: "2026-09-26", rt: "9", pid: 99, start_s: 37790, first_seen_at: "2026-09-26 10:30:00-05", n_reports: 3, first_vid: "B", last_vid: "B"}
          - {service_date: "2026-09-26", rt: "9", pid: 10, start_s: 44800, first_seen_at: "2026-09-26 12:27:00-05", n_reports: 4, first_vid: "C", last_vid: "C"}
          - {service_date: "2026-09-26", rt: "9", pid: 11, start_s: 49990, first_seen_at: "2026-09-26 13:53:00-05", n_reports: 6, first_vid: "E", last_vid: "E"}
      - input: ref('stg_patterns')
        rows:
          - {pid: 10, rt: "9", direction: "North"}
          - {pid: 11, rt: "9", direction: "North"}
          - {pid: 99, rt: "9", direction: "North"}
    expect:
      rows:
        - {trip_id: "T1", matched_on: "pattern", observed_pid: 10}
        - {trip_id: "T2", matched_on: "route", observed_pid: 99}
        - {trip_id: "T13", matched_on: "pattern", observed_pid: 11}

  - name: missing_trip_evidence_is_physical
    description: >
      Where the block's bus was decides between a dead tracker and a ghost: reappearing at the
      far end means it drove the trip; at the same end, it sat; seen elsewhere during the trip,
      it didn't run it; the block's bus or CTA's predicted bus on the trip's own pattern ran it
      under another key.
    model: int_missing_trip_evidence
    given:
      - input: ref('int_scheduled_trips')
        rows:
          - {service_date: "2026-09-26", trip_id: "P1", feed_id: "f", rt: "9", direction: "North", block_id: "E1", pid: 10, start_s: 39600, end_s: 40800, scheduled_start: "2026-09-26 11:00:00-05", scheduled_end: "2026-09-26 11:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "X1", feed_id: "f", rt: "9", direction: "North", block_id: "E1", pid: 10, start_s: 41400, end_s: 42600, scheduled_start: "2026-09-26 11:30:00-05", scheduled_end: "2026-09-26 11:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "P2", feed_id: "f", rt: "9", direction: "North", block_id: "E2", pid: 10, start_s: 43200, end_s: 44400, scheduled_start: "2026-09-26 12:00:00-05", scheduled_end: "2026-09-26 12:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "X2", feed_id: "f", rt: "9", direction: "North", block_id: "E2", pid: 10, start_s: 45000, end_s: 46200, scheduled_start: "2026-09-26 12:30:00-05", scheduled_end: "2026-09-26 12:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "P3", feed_id: "f", rt: "9", direction: "North", block_id: "E3", pid: 10, start_s: 46800, end_s: 48000, scheduled_start: "2026-09-26 13:00:00-05", scheduled_end: "2026-09-26 13:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "X3", feed_id: "f", rt: "9", direction: "North", block_id: "E3", pid: 10, start_s: 48600, end_s: 49800, scheduled_start: "2026-09-26 13:30:00-05", scheduled_end: "2026-09-26 13:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "P4", feed_id: "f", rt: "9", direction: "North", block_id: "E4", pid: 10, start_s: 50400, end_s: 51600, scheduled_start: "2026-09-26 14:00:00-05", scheduled_end: "2026-09-26 14:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "X4", feed_id: "f", rt: "9", direction: "North", block_id: "E4", pid: 10, start_s: 52200, end_s: 53400, scheduled_start: "2026-09-26 14:30:00-05", scheduled_end: "2026-09-26 14:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "P6", feed_id: "f", rt: "9", direction: "North", block_id: "E6", pid: 10, start_s: 57600, end_s: 58800, scheduled_start: "2026-09-26 16:00:00-05", scheduled_end: "2026-09-26 16:20:00-05"}
          - {service_date: "2026-09-26", trip_id: "X6", feed_id: "f", rt: "9", direction: "North", block_id: "E6", pid: 10, start_s: 59400, end_s: 60600, scheduled_start: "2026-09-26 16:30:00-05", scheduled_end: "2026-09-26 16:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X5", feed_id: "f", rt: "9", direction: "North", block_id: "E5", pid: 10, start_s: 55800, end_s: 57000, scheduled_start: "2026-09-26 15:30:00-05", scheduled_end: "2026-09-26 15:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X7", feed_id: "f", rt: "9", direction: "North", block_id: "E7", pid: 10, start_s: 63000, end_s: 64200, scheduled_start: "2026-09-26 17:30:00-05", scheduled_end: "2026-09-26 17:50:00-05"}
      - input: ref('int_trip_matches')
        rows:
          - {service_date: "2026-09-26", trip_id: "P1", matched_on: "pattern", n_reports: 5, first_vid: "V1", last_vid: "V1"}
          - {service_date: "2026-09-26", trip_id: "P2", matched_on: "pattern", n_reports: 5, first_vid: "V2", last_vid: "V2"}
          - {service_date: "2026-09-26", trip_id: "P3", matched_on: "pattern", n_reports: 5, first_vid: "V3", last_vid: "V3"}
          - {service_date: "2026-09-26", trip_id: "P4", matched_on: "pattern", n_reports: 5, first_vid: "V4", last_vid: "V4"}
          - {service_date: "2026-09-26", trip_id: "P6", matched_on: "pattern", n_reports: 5, first_vid: "V6", last_vid: "V6"}
      - input: ref('int_scheduled_departures')
        rows:
          - {service_date: "2026-09-26", trip_id: "X1", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 11:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X1", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 11:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X2", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 12:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X2", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 12:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X3", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 13:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X3", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 13:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X4", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 14:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X4", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 14:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X6", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 16:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X6", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 16:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X5", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 15:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X5", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 15:50:00-05"}
          - {service_date: "2026-09-26", trip_id: "X7", stop_id: "A", stop_sequence: 1, departs_at: "2026-09-26 17:30:00-05"}
          - {service_date: "2026-09-26", trip_id: "X7", stop_id: "B", stop_sequence: 2, departs_at: "2026-09-26 17:50:00-05"}
      - input: ref('stg_predictions')
        rows:
          # CTA assigned bus P7 to X7 (not canceled) at X7's first stop
          - {rt: "9", vid: "P7", dyn: 0, stsd: "2026-09-26", stst: 62990, stpid: "A", fetched_at: "2026-09-26 17:20:00-05"}
      - input: ref('stg_gtfs_stops')
        rows:
          - {feed_id: "f", stop_id: "A", lat: 41.0, lon: -87.6}
          - {feed_id: "f", stop_id: "B", lat: 41.05, lon: -87.6}
      - input: ref('stg_bus_positions')
        rows:
          # V1 invisible during X1, next seen at the far end (B): drove it with a dead tracker
          - {vid: "V1", observed_at: "2026-09-26 11:52:00-05", rt: "9", pid: 12, pdist: 100, lat: 41.05, lon: -87.6}
          # V2 invisible during X2, next seen back at A: sat there
          - {vid: "V2", observed_at: "2026-09-26 12:58:00-05", rt: "9", pid: 10, pdist: 100, lat: 41.0, lon: -87.6}
          # V3 seen during X3 on another pattern: didn't run it, tracker worked
          - {vid: "V3", observed_at: "2026-09-26 13:40:00-05", rt: "9", pid: 20, pdist: 100, lat: 41.02, lon: -87.65}
          # V4 seen during X4 on X4's own pattern under another key: ran it, mis-keyed
          - {vid: "V4", observed_at: "2026-09-26 14:40:00-05", rt: "9", pid: 10, pdist: 100, lat: 41.02, lon: -87.6}
          # V6 never seen again
          # P7, CTA's predicted bus for X7, ran X7's pattern during it under another key
          - {vid: "P7", observed_at: "2026-09-26 17:40:00-05", rt: "9", pid: 10, pdist: 900, lat: 41.02, lon: -87.6}
    expect:
      rows:
        - {trip_id: "X1", block_vid: "V1", evidence: "reappeared_far_end"}
        - {trip_id: "X2", block_vid: "V2", evidence: "reappeared_same_end"}
        - {trip_id: "X3", block_vid: "V3", evidence: "bus_elsewhere"}
        - {trip_id: "X4", block_vid: "V4", evidence: "bus_on_this_pattern"}
        - {trip_id: "X5", block_vid: null, evidence: "no_block_bus"}
        - {trip_id: "X6", block_vid: "V6", evidence: "bus_not_seen_again"}
        - {trip_id: "X7", block_vid: null, evidence: "bus_on_this_pattern"}

  - name: trip_status_rules
    description: >
      Status is the first rule that applies: ran (2+ reports), flagged only by a flag at a stop
      the trip serves, unknown when not watched or near a detour, likely_ran for a single report
      or physical evidence the bus drove it, then silent when its stops were sampled, else
      missing. strict_evidence marks silent/missing trips with physical evidence the bus didn't run it.
    model: trip_status
    overrides:
      vars: {as_of: "2026-09-27 06:00:00-05"}
    given:
      - input: ref('int_scheduled_trips')
        rows:
          - {service_date: "2026-09-26", trip_id: "R1", feed_id: "f", rt: "9", direction: "North", block_id: "bR1", pid: 10, start_s: 28800, end_s: 30000, scheduled_start: "2026-09-26 08:00:00-05", scheduled_end: "2026-09-26 08:02:00-05"}
