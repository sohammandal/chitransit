# Intermediate and analytics models, derived from Ingress (Iceberg via Glue) and GTFS versions.
# Every model covers a window of service dates (vars start_date/end_date), so a rerun of
# the same window rebuilds the same rows (idempotent).
name: ghost_ledger
version: "1.0.0"
profile: ghost_ledger
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target]

vars:
  # Service dates to build (Chicago). Default: the last 3 complete service days.
  start_date: null
  end_date: null
  days: 3
  # "Now" for the pending check; pin it to replay a past run exactly. null = run time.
  as_of: null
  # Business-rule thresholds (sensitivity report: transform/sensitivity.py).
  # Changing one changes the published numbers: record it in the method changelog.
  rule_coverage_min: 0.9       # share of a trip's minutes the feed was swept to judge it
  rule_start_tolerance_s: 120  # GTFS first departure is 0..this many seconds after stst
  rule_reappear_m: 500         # a vanished bus reappearing this close to a trip end
  rule_flag_window_min: 30     # a stop sampled this long before the trip was due there
  rule_min_flag_looks: 2       # samples of its stops needed to call a trip unannounced
  rule_start_ft: 150           # a trip is under way this far past its lowest report (= live.START_FT)
  rule_first_seen_ft: 500      # a trip first seen this soon past a stop passed it (= live.FIRST_SEEN_FT)
  rule_dwell_ft: 100           # a bus this close to a stop is at it (= live.DWELL_FT)
  rule_terminal_ft: 1000       # back this far on a new trip: the bus started over (= live.TERMINAL_FT)

models:
  ghost_ledger:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    analytics:
      +materialized: table
