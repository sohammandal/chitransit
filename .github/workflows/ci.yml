name: ci

# Every PR and every push to main: lint, then the full test suite against a real Postgres
# (logical replication on, migrations applied). On main only, build the prod image and push
# it to GHCR; the box pulls :main within 5 minutes (infra/box/deploy.sh).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Start Postgres and apply migrations
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm dbmate up

      - name: Test
        run: uv run pytest -v

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghost-ledger:main
            ghcr.io/${{ github.repository_owner }}/ghost-ledger:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
